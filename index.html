<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16303d">
<title>Hojarasca</title>

<style>
:root{
  --ember:#e8742a; --gold:#f2b134; --bark:#1c1013; --bone:#f3e6cf;
  --bubble:#000; --bubble-ink:#fff; --scrim:rgba(12,7,9,.72);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --scrim:rgba(6,4,6,.78); } }
:root[data-theme="dark"]{ --scrim:rgba(6,4,6,.78); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bark);color:var(--bone);
  font-family:'Patrick Hand SC','Patrick Hand','Comic Sans MS',cursive,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
.screen.on{display:block}
.screen button,.screen .pe{pointer-events:auto}
button{font:inherit;color:var(--bubble-ink);background:var(--bubble);border:3px solid transparent;border-radius:24px;
  padding:.3em 1.1em;font-size:22px;cursor:pointer;line-height:1.15;transition:transform .12s,border-color .12s,background .12s}
button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
button:active:not(:disabled){transform:translateY(1px) scale(.97)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
#title .wrap{position:absolute;left:0;right:0;top:calc(var(--st) + 5vh);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 16px}
#title h1{margin:0;font-family:'Amatic SC','Patrick Hand SC',cursive;font-weight:700;font-size:clamp(70px,16vw,168px);line-height:.82;
  letter-spacing:.03em;color:var(--bone);text-shadow:0 6px 0 #1a0e10,0 0 60px rgba(242,177,52,.35)}
.bubble{position:relative;background:var(--bubble);color:var(--bubble-ink);border-radius:28px;padding:.4em 1.1em;font-size:clamp(18px,2.4vw,25px);max-width:min(90vw,560px);line-height:1.2}
.bubble::after{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:15px solid var(--bubble)}
#title .btns{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap;justify-content:center}
#title .btns button{font-size:30px;padding:.25em 1.5em}
#title .keys{position:absolute;bottom:calc(var(--sb) + 14px);left:0;right:0;text-align:center;font-size:18px;color:var(--bone);text-shadow:0 2px 0 #000;opacity:.85;padding:0 12px}
body.hasBanner #title .keys{bottom:calc(var(--sb) + 110px)}
@media (max-height:560px){ body.hasBanner #title .keys{display:none} }
.corner{position:absolute}
.tl{top:calc(var(--st) + 12px);left:calc(var(--sl) + 12px)}
.tr{top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px)}
.tl2{top:calc(var(--st) + 66px);left:calc(var(--sl) + 12px);font-size:19px;padding:.2em .9em}
.storybox{position:absolute;left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);width:min(760px,92vw);min-height:92px;padding:14px 22px 28px;
  border-radius:26px;background:#000;color:#fff;font-size:clamp(18px,2.4vw,24px);line-height:1.3;cursor:pointer;text-align:left}
.storybox .who{font-size:16px;color:var(--gold);margin-bottom:4px;min-height:1em}
.storybox .hint{position:absolute;right:18px;bottom:8px;font-size:14px;opacity:.6}
.storybox.note{background:#f3e6cf;color:#3a2a22;font-family:'Amatic SC','Patrick Hand SC',cursive;font-weight:700;font-size:clamp(24px,3.3vw,32px);line-height:1.15;
  transform:translateX(-50%) rotate(-1.2deg);border-radius:6px;box-shadow:0 8px 0 rgba(0,0,0,.28);background-image:repeating-linear-gradient(transparent 0 33px,rgba(58,42,34,.12) 33px 34px)}
.storybox.note .who{color:#8a5a3a;font-family:'Patrick Hand SC',cursive;font-weight:400;font-size:16px}
.storybox.note .hint{color:#3a2a22}
.storybox.forest{background:#241010;border:2px solid #e8742a;color:#f2b134;font-style:italic;letter-spacing:.02em}
.storybox.forest .who{color:#e8742a;font-style:normal}
@media (max-height:480px){ .storybox{min-height:70px;padding:10px 18px 22px;bottom:calc(var(--sb) + 8px)} }
.arrow{top:50%;transform:translateY(-50%);font-size:40px;width:58px;height:58px;padding:0 0 6px;border-radius:50%}
.arrow:hover:not(:disabled){transform:translateY(-50%) scale(1.06)}
.arrow:active:not(:disabled){transform:translateY(-50%) scale(.95)}
#prevW{left:calc(var(--sl) + 10px)} #nextW{right:calc(var(--sr) + 10px)}
#pauseBtn{width:50px;height:50px;padding:0;border-radius:50%;font-size:22px;background:rgba(0,0,0,.72)}
#lvlLabel{font-size:21px;padding:.2em .9em;border-radius:20px;background:rgba(0,0,0,.72);color:#fff}
#skipBtn{top:calc(var(--st) + 12px);right:calc(var(--sr) + 72px);display:none;font-size:19px;padding:.25em .9em;background:var(--ember);color:#1a0d08}
#rotateTip{top:calc(var(--st) + 70px);left:50%;transform:translateX(-50%);font-size:18px;display:none;align-items:center;gap:10px;padding:.3em .5em .3em 1em;border-radius:20px;background:#000;color:#fff;white-space:nowrap}
#rotateTip button{font-size:16px;padding:.1em .7em;background:#2a1d20}
#touch{z-index:6}
.tbtn{position:absolute;width:calc(80px * var(--bs,1));height:calc(80px * var(--bs,1));border-radius:50%;
  background:rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
.tbtn.big{width:calc(96px * var(--bs,1));height:calc(96px * var(--bs,1))}
.tbtn svg{width:44%;height:44%;fill:#fff;pointer-events:none}
.tbtn.on{background:rgba(0,0,0,.72);border-color:var(--gold)}
/* Banner de AdSense (solo en portada y mapa) */
#adBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 6px);width:min(728px,96vw);min-height:50px;max-height:100px;z-index:7;display:none;
  align-items:center;justify-content:center;overflow:hidden;border-radius:10px}
#adBanner.on{display:flex}
#adBanner.demo{border:2px dashed rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:rgba(255,255,255,.75);font-size:16px;padding:6px 12px;text-align:center}
#adBanner ins{display:block;width:100%}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--scrim);z-index:20;padding:16px}
#modal.on{display:flex}
.panel{background:#000;color:#fff;border-radius:30px;padding:22px 26px 24px;width:min(520px,94vw);max-height:90vh;overflow:auto;text-align:center;touch-action:pan-y}
.panel h2{font-family:'Amatic SC','Patrick Hand SC',cursive;font-size:56px;margin:0 0 4px;line-height:1;color:var(--bone)}
.panel p{font-size:20px;margin:4px 0 16px;line-height:1.3}
.panel .small{font-size:16px;opacity:.8}
.panel a{color:var(--gold)}
.panel .col{display:flex;flex-direction:column;gap:10px}
.panel .rowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.panel .rowb button{flex:1 1 140px}
.panel button{background:#1f1518;border-color:#34262a;font-size:22px}
.panel button.primary{background:var(--ember);color:#1a0d08}
.panel .big{font-family:'Amatic SC',cursive;font-size:84px;line-height:.9;color:var(--gold)}
.panel .count{font-family:'Amatic SC',cursive;font-size:64px;color:var(--gold);margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 2px;border-bottom:2px dashed #2b1f22;font-size:20px;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
input[type=range]{accent-color:var(--ember);width:min(170px,40vw);cursor:pointer}
input[type=checkbox]{accent-color:var(--ember);width:24px;height:24px;cursor:pointer;flex:none}
select{font:inherit;font-size:19px;background:#1f1518;color:#fff;border:2px solid #34262a;border-radius:14px;padding:3px 10px;cursor:pointer}
input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.panel button.card{width:146px;padding:10px 8px 12px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#1a1215;border:3px solid #34262a}
.panel button.card.sel{border-color:var(--gold);background:#2a1c14}
.card canvas{width:110px;height:110px;display:block}
.card strong{font-size:24px;line-height:1}
.card span{font-size:15px;line-height:1.2;opacity:.85}
.card em{font-style:normal;font-size:15px;color:var(--gold);min-height:18px}
@media (max-height:480px){ .card canvas{width:76px;height:76px} .panel button.card{width:132px} .card span{font-size:13px} }
@media (max-height:480px){ .panel{padding:14px 20px} .panel h2{font-size:44px} .row{padding:5px 2px} #title .btns{margin-top:12px} }
@media (prefers-reduced-motion: reduce){ button{transition:none} }
</style>
</head>

  return { done: grid5(false), deaths: grid5(0), skipped: grid5(false), world: 0, sel: [0, 0, 0, 0, 0], cleared: [false, false, false, false, false],
           settings: defSettings(), consent: null, ads: { since: 0, last: 0 }, story: {} };
}
let SAVE = defSave();
function loadSave() {
  try {
    let s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!s) s = JSON.parse(localStorage.getItem('hojarasca.save.v1') || 'null');  // progreso de la versión anterior
    if (!s || !Array.isArray(s.done)) return;
    const d = defSave();
    for (let w = 0; w < 5; w++) for (let l = 0; l < 20; l++) {
      d.done[w][l] = !!(s.done[w] && s.done[w][l]);
      d.deaths[w][l] = Math.max(0, (s.deaths && s.deaths[w] && +s.deaths[w][l]) || 0);
      d.skipped[w][l] = !!(s.skipped && s.skipped[w] && s.skipped[w][l]);
    }
    d.world = clamp(+s.world || 0, 0, 4);
    if (Array.isArray(s.sel)) d.sel = d.sel.map((v, i) => clamp(+s.sel[i] || 0, 0, 19));
    if (Array.isArray(s.cleared)) d.cleared = d.cleared.map((v, i) => !!s.cleared[i]);
    d.settings = Object.assign(defSettings(), s.settings || {});
    if (s.consent && typeof s.consent === 'object') d.consent = { pers: !!s.consent.pers, ts: +s.consent.ts || 0 };
    if (s.ads) d.ads = { since: +s.ads.since || 0, last: +s.ads.last || 0 };
    if (s.story && typeof s.story === 'object') for (const k in s.story) d.story[k] = !!s.story[k];
    SAVE = d;
  } catch (e) { /* guardado corrupto o sin acceso */ }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
function detectLang() { const l = ((navigator.languages && navigator.languages[0]) || navigator.language || 'es').slice(0, 2).toLowerCase(); return I18N[l] ? l : 'en'; }
const worldUnlocked = w => w === 0 || SAVE.done[w - 1].every(Boolean);
const levelUnlocked = (w, l) => worldUnlocked(w) && (l === 0 || SAVE.done[w][l - 1]);
const worldDeaths = w => SAVE.deaths[w].reduce((a, b) => a + b, 0);
const totalDeaths = () => SAVE.deaths.reduce((a, r) => a + r.reduce((x, y) => x + y, 0), 0);
// ---------- Audio sintetizado (Web Audio) ----------
const AU = { ctx: null, sfx: null, mus: null, noise: null, next: 0, step: 0 };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C(); AU.ctx = ctx;
    const master = ctx.createGain(); master.connect(ctx.destination);
    AU.sfx = ctx.createGain(); AU.sfx.connect(master);
    AU.mus = ctx.createGain();
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900;
    AU.mus.connect(lp); lp.connect(master);
    const b = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = b; applyVolumes();

}
function applyVolumes() { if (!AU.ctx) return; AU.sfx.gain.value = SAVE.settings.sfx * 0.9; AU.mus.gain.value = SAVE.settings.music * 0.32; }
function tone(type, f0, f1, dur, vol = 0.2, delay = 0) {
  if (!AU.ctx || SAVE.settings.sfx <= 0) return;
  const c = AU.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.sfx); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.2, freq = 1200, type = 'lowpass', delay = 0) {
  if (!AU.ctx || SAVE.settings.sfx <= 0) return;
  const c = AU.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AU.sfx); s.start(t); s.stop(t + dur + 0.03);
}
const SFX = {
  jump: () => tone('square', 320, 620, 0.1, 0.06),
  land: () => noise(0.07, 0.14, 450),
  die: () => { noise(0.4, 0.35, 900); tone('sawtooth', 260, 45, 0.45, 0.12); },
  trap: () => tone('triangle', 170, 55, 0.25, 0.28),
  door: () => [523, 659, 784, 1047].forEach((f, i) => tone('sine', f, f, 0.3, 0.14, i * 0.07)),
  flip: up => tone('sine', up ? 180 : 720, up ? 720 : 180, 0.32, 0.16),
  crumble: () => noise(0.2, 0.22, 1800, 'bandpass'),
  click: () => tone('triangle', 900, 650, 0.05, 0.08),
  bonk: () => tone('square', 170, 110, 0.09, 0.12),
  slam: () => { noise(0.22, 0.4, 260); tone('sine', 95, 40, 0.28, 0.3); },
  hop: () => tone('triangle', 480, 960, 0.14, 0.1),
  invert: () => { tone('square', 420, 300, 0.12, 0.07); tone('square', 300, 420, 0.12, 0.07, 0.12); },
  reveal: () => tone('sine', 1200, 1600, 0.12, 0.06)

// Música: arpegios suaves en bucle, uno por mundo
const PROG = [
  [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],
  [[52, 55, 59], [48, 52, 55], [55, 59, 62], [50, 54, 57]],
  [[50, 53, 57], [46, 50, 53], [53, 57, 60], [48, 52, 55]],
  [[47, 50, 54], [43, 47, 50], [50, 54, 57], [45, 49, 52]],
  [[54, 57, 61], [50, 54, 57], [57, 61, 64], [52, 56, 59]]
];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function pluck(f, t, dur, vol, type = 'triangle') {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.mus); o.start(t); o.stop(t + dur + 0.05);
}
function musicTick(world) {
  if (!AU.ctx || AU.ctx.state !== 'running' || SAVE.settings.music <= 0.001) return;
  const c = AU.ctx, eighth = 60 / 84 / 2, prog = PROG[world] || PROG[0];
  if (AU.next < c.currentTime) AU.next = c.currentTime + 0.05;
  while (AU.next < c.currentTime + 0.3) {
    const s = AU.step, chord = prog[Math.floor(s / 8) % prog.length], pat = [0, 1, 2, 1, 0, 2, 1, 2];
    const up = (s % 16 >= 8 && s % 4 === 3) ? 12 : 0;
    pluck(midi(chord[pat[s % 8]] + up), AU.next, 0.55, 0.085);
    if (s % 8 === 0) pluck(midi(chord[0] - 12), AU.next, 1.8, 0.12, 'sine');
    if (s % 32 === 30 && R() < 0.6) pluck(midi(chord[2] + 12), AU.next, 0.9, 0.04, 'sine');
    AU.step++; AU.next += eighth;
  }
}
SFX.boulder = () => { noise(0.35, 0.25, 180); tone('sine', 70, 50, 0.4, 0.2); };
SFX.wind = () => noise(0.9, 0.18, 700, 'bandpass');
SFX.lamp = () => [660, 880, 1320].forEach((f, i) => tone('sine', f, f, 0.22, 0.09, i * 0.06));
SFX.horn = () => { tone('sawtooth', 220, 210, 0.7, 0.08); tone('sawtooth', 277, 265, 0.7, 0.06); };
SFX.spring = () => tone('triangle', 220, 880, 0.18, 0.14);
SFX.rumble = () => noise(0.25, 0.16, 220);
SFX.mute = on => { if (AU.ctx) try { AU.ctx[on ? 'suspend' : 'resume'](); } catch (e) {} };

// =========================================================
//  ENTIDADES: cada trampa tiene varias "conductas" y el generador
//  elige una distinta en cada intento (no basta con memorizar).
//  Interfaz: update(dt), draw(c,W), solid() -> rect|null, hazards(out)
// =========================================================
function spikeBox(x, y, w, h, dir) {
  return dir === 'up' ? { x: x + 3, y: y + h * 0.35, w: w - 6, h: h * 0.65, cause: 'thorn' } : { x: x + 3, y, w: w - 6, h: h * 0.65, cause: 'thorn' };
}
const underPlayer = (e, pad = 0) => { const P = G.P; return P.x + P.w > e.x - pad && P.x < e.x + e.w + pad; };
function rumbleAt(x, y, w) { for (let i = 0; i < 3; i++) addPart({ x: x + R() * w, y, vx: (R() - 0.5) * 40, vy: -40 - R() * 60, life: 0.4, max: 0.4, sz: 2 + R() * 2, c: G.W.lip, g: 400, rot: 0, vr: 0, k: 0 }); }

class PopSpike {              // espinas escondidas: early | late | fake | double
  constructor(x, y, w, mode) { Object.assign(this, { x, y, w, mode, t: 0, up: false, s: 'idle', k: 0 }); }
  pop() { if (this.s !== 'idle') return; this.s = this.mode === 'early' ? 'up' : 'rumble'; this.k = this.mode === 'late' ? 0.22 : 0.35; if (this.s === 'up') SFX.trap(); else SFX.rumble(); }
  update(dt) {
    if (this.s === 'rumble') { this.k -= dt; if (R() < 0.5) rumbleAt(this.x, this.y, this.w);
      if (this.k <= 0) { if (this.mode === 'fake') this.s = 'done'; else { this.s = 'up'; SFX.trap(); this.k = 0.8; } } }
    else if (this.s === 'up') { this.t = Math.min(1, this.t + dt / 0.07);
      if (this.mode === 'double') { this.k -= dt; if (this.k <= 0) { this.s = 'down'; this.k = 0.55; } } }
    else if (this.s === 'down') { this.t = Math.max(0, this.t - dt / 0.12); this.k -= dt; if (this.k <= 0) { this.s = 'up'; this.mode = 'early'; SFX.trap(); } }
  }
  hazards(o) { if (this.t > 0.5) o.push(spikeBox(this.x, this.y - SPH, this.w, SPH, 'up')); }
  draw(c, W) {
    if (this.t <= 0) return;
    c.save(); c.beginPath(); c.rect(this.x - 4, this.y - SPH - 8, this.w + 8, SPH + 8); c.clip();
    drawThorns(c, this.x, this.y - SPH * this.t, this.w, SPH, 'up', W); c.restore();
  }
}

class FallSpike {             // lo que cae del techo: drop | under | stay
  constructor(x, y, mode) { Object.assign(this, { x: x + 6, y, w: 18, h: 26, vy: 0, s: 'hang', t: 0, mode: mode || 'drop', x0: x }); }
  drop(delay) {
    if (this.s !== 'hang') return;
    if (this.mode === 'under') { this.s = 'armed'; return; }
    if (this.mode === 'stay') { this.s = 'wobble'; this.t = 0.5; return; }
    this.s = 'wait'; this.t = delay || 0.05;
  }
  update(dt) {
    if (this.s === 'armed') { const P = G.P; if (Math.abs(P.x + P.w / 2 - (this.x + this.w / 2)) < 34) { this.s = 'wait'; this.t = 0.28; SFX.rumble(); } }
    else if (this.s === 'wobble') { this.t -= dt; if (this.t <= 0) this.s = 'hang'; }
    else if (this.s === 'wait') { this.t -= dt; if (this.t <= 0) { this.s = 'fall'; this.vy = 280; } }
    else if (this.s === 'fall') {
      this.vy += 3000 * dt; this.y += this.vy * dt;
      const hit = solidAtPoint(this.x + this.w / 2, this.y + this.h);
      if (hit) { this.y = hit.y - this.h; this.s = 'land'; this.t = 0.35; SFX.land(); dust(this.x + this.w / 2, this.y + this.h, 6, 1); nearMiss(this.x + this.w / 2, this.y + this.h / 2, 48); }
      else if (this.y > G.L.h + 50) this.s = 'gone';
    } else if (this.s === 'land') { this.t -= dt; if (this.t <= 0) { this.s = 'gone'; burst(this.x + this.w / 2, this.y + this.h / 2, 8, [G.W.hzB, G.W.hzA], 160); } }
  }
  hazards(o) { if (this.s !== 'gone') o.push({ x: this.x + 1, y: this.y + 2, w: this.w - 2, h: this.h - 4, cause: 'fang' }); }
  draw(c, W) { if (this.s === 'gone') return; const sh = (this.s === 'wait' || this.s === 'wobble') ? (R() - 0.5) * 3 : 0;
    drawFang(c, this.x + sh, this.y, this.w, this.h, W, this.s === 'fall'); }
}

class Crumble {               // tablón que se desmorona
  constructor(x, y, w, shakeT) { Object.assign(this, { x, y0: y, y, w, h: 16, s: 'idle', t: 0, vy: 0, a: 1, shakeT: shakeT || 0.32 }); }
  step() { if (this.s === 'idle') { this.s = 'shake'; this.t = this.shakeT; SFX.crumble(); } }
  update(dt) {
    if (this.s === 'shake') { this.t -= dt; if (this.t <= 0) { this.s = 'fall'; this.vy = 0; } }
    else if (this.s === 'fall') { this.vy += 2600 * dt; this.y += this.vy * dt; if (this.y > this.y0 + 600) { this.s = 'gone'; this.t = 2.2; } }
    else if (this.s === 'gone') { this.t -= dt; if (this.t <= 0 && !overlap(G.P, { x: this.x, y: this.y0, w: this.w, h: this.h })) { this.s = 'idle'; this.y = this.y0; this.a = 0; } }
    if (this.a < 1) this.a = Math.min(1, this.a + dt * 3);
  }
  solid() { return (this.s === 'idle' || this.s === 'shake') ? { x: this.x, y: this.y, w: this.w, h: this.h, ref: this } : null; }
  draw(c) { if (this.s === 'gone') return; c.globalAlpha = this.a;
    drawPlank(c, this.x + (this.s === 'shake' ? (R() - 0.5) * 3 : 0), this.y, this.w, this.h, this.s !== 'idle'); c.globalAlpha = 1; }
}

class DropFloor {             // suelo que se hunde: now | rumble
  constructor(x, y, w, h, mode) { Object.assign(this, { x, y, w, h, y0: y, mode, s: 'idle', vy: 0, t: 0, tiles: true }); }
  drop() { if (this.s !== 'idle') return; if (this.mode === 'rumble') { this.s = 'rumble'; this.t = 0.28; SFX.rumble(); } else { this.s = 'fall'; SFX.trap(); } }
  update(dt) {
    if (this.s === 'rumble') { this.t -= dt; if (R() < 0.5) rumbleAt(this.x, this.y, this.w); if (this.t <= 0) { this.s = 'fall'; SFX.trap(); } }
    else if (this.s === 'fall') { this.vy += 3200 * dt; this.y += this.vy * dt; if (this.y > this.y0 + 700) this.s = 'gone'; }
  }
  solid() { return (this.s === 'idle' || this.s === 'rumble') ? { x: this.x, y: this.y, w: this.w, h: this.h, ref: this } : null; }
  draw(c, W) { if (this.s !== 'gone') drawBlock(c, this.x + (this.s === 'rumble' ? (R() - 0.5) * 2 : 0), this.y, this.w, this.h, W); }
}

class SlideFloor {            // suelo que se desliza y te deja un hueco (y te lleva si estás encima)
  constructor(x, y, w, h, dx, mode) { Object.assign(this, { x, y, w, h, x0: x, dx, mode, s: 'idle', k: 0, t: 0 }); }
  go() { if (this.s === 'idle' && this.mode !== 'none') { this.s = this.mode === 'onland' ? 'wait' : 'move'; this.t = 0.15; SFX.trap(); } }
  step() { if (this.mode === 'onland') this.go(); }
  update(dt) {
    if (this.s === 'wait') { this.t -= dt; if (this.t <= 0) this.s = 'move'; }
    else if (this.s === 'move') {
      const ox = this.x; this.k = Math.min(1, this.k + dt / 0.35); const e = 1 - (1 - this.k) ** 2; this.x = this.x0 + this.dx * e;
      if (G.P.gref && G.P.gref.ref === this) G.P.x += this.x - ox;
      if (this.k >= 1) this.s = 'done';
    }
  }
  solid() { return { x: this.x, y: this.y, w: this.w, h: this.h, ref: this }; }
  draw(c, W) { drawBlock(c, this.x, this.y, this.w, this.h, W); }
}

class Crusher {               // aplastador: slam | late | feint | double | periodic
  constructor(o) { Object.assign(this, o); this.y = o.yUp; this.vy = 0; this.t = o.mode === 'periodic' ? o.pattern[0] : 0; this.pi = 0; this.slams = 0;
    this.s = o.mode === 'periodic' ? 'wait' : 'armed'; }
  trigger() {
    if (this.s !== 'armed') return;
    if (this.mode === 'slam' || this.mode === 'double') this.startSlam();
    else if (this.mode === 'late') this.s = 'lurk';
    else if (this.mode === 'feint') { this.s = 'feint'; this.vy = 0; SFX.trap(); }
  }
  startSlam() { this.s = 'slam'; this.vy = 0; }
  update(dt) {
    const dist = this.yDown - this.yUp;
    switch (this.s) {
      case 'wait': this.t -= dt; if (this.t <= 0) this.startSlam(); break;
      case 'lurk': if (underPlayer(this, -4)) { this.s = 'delay'; this.t = 0.42; SFX.rumble(); } break;
      case 'delay': this.t -= dt; if (this.t <= 0) this.startSlam(); break;
      case 'feint': this.vy += 5200 * dt; this.y += this.vy * dt; if (this.y >= this.yUp + dist * 0.35) { this.y = this.yUp + dist * 0.35; this.s = 'hover'; this.t = 0.6; } break;
      case 'hover': this.t -= dt; if (this.t <= 0) { this.y -= 120 * dt; if (this.y <= this.yUp) { this.y = this.yUp; this.s = 'lurk'; } } break;
      case 'slam':
        this.vy += 5200 * dt; this.y += this.vy * dt;
        if (this.y >= this.yDown) { this.y = this.yDown; this.s = 'hold'; this.t = 0.4; this.slams++; SFX.slam(); shake(5, 0.18); dust(this.x + this.w / 2, this.y + this.h, 10, 1); nearMiss(this.x + this.w / 2, this.y + this.h - 12, 62); }
        if (G.state === 'play') { const P = G.P; if (overlap({ x: P.x + 3, y: P.y, w: P.w - 6, h: P.h }, this)) die('crush'); }
        break;
      case 'hold': this.t -= dt; if (this.t <= 0) this.s = 'rise'; break;
      case 'rise':
        this.y -= (this.mode === 'double' && this.slams === 1 ? 320 : 150) * dt;
        if (this.mode === 'double' && this.slams === 1 && this.y <= this.yUp + dist * 0.5) { this.startSlam(); break; }
        if (this.y <= this.yUp) { this.y = this.yUp;
          if (this.mode === 'periodic') { this.pi = (this.pi + 1) % this.pattern.length; this.t = this.pattern[this.pi]; this.s = 'wait'; } else this.s = 'done'; }
        break;
    }
  }
  solid() { return this.s === 'slam' ? null : { x: this.x, y: this.y, w: this.w, h: this.h, ref: this }; }   // mientras cae no empuja: aplasta
  draw(c, W) { drawCrusher(c, this, W); }
}

class Saw {                   // estrella giratoria (solo en el mundo 5)
  constructor(o) { Object.assign(this, o); this.a = 0; this.t = o.phase || 0; this.cx = o.x1; this.cy = o.y1; this.update(0); }
  update(dt) {
    this.t += dt; this.a += dt * 7; let k;
    if (this.mode === 'line') { const L = Math.hypot(this.x2 - this.x1, this.y2 - this.y1) || 1; let s = (this.t * this.speed) % (2 * L); if (s > L) s = 2 * L - s; k = s / L; }
    else k = (Math.sin(this.t * this.w) + 1) / 2;
    this.cx = lerp(this.x1, this.x2, k); this.cy = lerp(this.y1, this.y2, k);
  }
  hazards(o) { o.push({ circ: true, x: this.cx, y: this.cy, r: this.r * 0.8, cause: 'saw' }); nearMiss(this.cx, this.cy, this.r + 24); }
  draw(c, W) { drawSaw(c, this.cx, this.cy, this.r, this.a, W); }
}

class Boulder {               // cae de las ramas y rueda hacia ti (o detrás de ti). 'dud': cae, tiembla y se rompe sola
  constructor(x, y, dir, speed, r, ceilY, mode) { Object.assign(this, { x, y, dir, speed, r: r || 17, vy: 0, s: 'idle', a: 0, x0: x, y0: y, ceilY: ceilY === undefined ? y - 300 : ceilY, mode: mode || 'roll', t: 0 }); }
  go() { if (this.s !== 'idle') return; this.s = 'drop'; this.y = this.ceilY + this.r + 2; this.vy = 280; SFX.trap(); burst(this.x, this.ceilY + 6, 6, G.W.tufts, 90); }
  update(dt) {
    if (this.s === 'drop') {
      this.vy += 2000 * dt; this.y += this.vy * dt; this.a += dt * 3;
      const below = solidAtPoint(this.x, this.y + this.r);
      if (below && this.vy > 0) { this.y = below.y - this.r; this.vy = 0; dust(this.x, this.y + this.r, 6, 1); SFX.boulder(); shake(3, 0.2);
        if (this.mode === 'dud') { this.s = 'dud'; this.t = 0.8; } else this.s = 'roll'; }
      else if (this.y > G.L.h + 60) this.s = 'gone';
      return;
    }
    if (this.s === 'dud') { this.t -= dt; this.a = Math.sin(this.t * 40) * 0.2 * (this.t / 0.8);
      if (this.t <= 0) { this.s = 'gone'; burst(this.x, this.y, 14, [G.W.hzA, G.W.lip, '#c9955e'], 170); SFX.crumble(); } return; }
    if (this.s !== 'roll') return;
    this.vy += 2000 * dt; this.y += this.vy * dt;
    const below = solidAtPoint(this.x, this.y + this.r);
    if (below && this.vy > 0) { this.y = below.y - this.r; if (this.vy > 300) { dust(this.x, this.y + this.r, 4, 1); } this.vy = 0; }
    this.x += this.dir * this.speed * dt; this.a += this.dir * this.speed * dt / this.r; nearMiss(this.x, this.y - this.r - 8, this.r + 26);
    if (solidAtPoint(this.x + this.dir * this.r, this.y - 2) || this.y > G.L.h + 60) { this.s = 'gone'; burst(this.x, this.y, 12, [G.W.hzA, G.W.hzB, G.W.lip], 200); SFX.crumble(); }

class Spring {                // seta / muelle que te lanza
  constructor(x, y, power) { Object.assign(this, { x, y: y - 12, w: T, h: 12, power: power || 1000, sq: 0 }); }
  update(dt) {
    this.sq = approach(this.sq, 0, dt * 4); const P = G.P;
    if (G.state === 'play' && P.grav > 0 && P.vy > 0 && overlap(P, this) && P.y + P.h < this.y + this.h + 6) {
      P.vy = -this.power; P.jumping = false; P.ground = false; P.coyote = 0; P.y = this.y - P.h; this.sq = 1; SFX.spring(); P.sq = 0.35;
    }
  }
  draw(c, W) { drawSpring(c, this, W); }
}

class Wind {                  // ráfaga que te empuja durante un rato
  constructor(x, y, w, h, force, dur) { Object.assign(this, { x, y, w, h, force, dur, t: 0, on: false }); }
  go() { if (!this.on && this.force) { this.on = true; this.t = this.dur; SFX.wind(); bubble(G.P, pick(tl('wind')), 1.2); } }
  update(dt) {
    if (!this.on) return; this.t -= dt; if (this.t <= 0) { this.on = false; return; }
    if (overlap(G.P, this)) G.windAx += this.force;
    if (R() < dt * 40) addPart({ x: this.force > 0 ? this.x : this.x + this.w, y: this.y + R() * this.h, vx: this.force * 0.45, vy: (R() - 0.5) * 20, life: 0.7, max: 0.7, sz: 2 + R() * 2, c: pick(G.W.tufts), g: 0, rot: R() * 6, vr: 8, k: 1 });
  }
  draw() {}
}

class GravPad {               // farolillo de gravedad (dir -1 = hacia arriba)
  constructor(x, y, dir) { Object.assign(this, { x, y, w: T, h: T, dir, t: R() * 6, cd: 0 }); }
  update(dt) { this.t += dt; if (this.cd > 0) { this.cd -= dt; return; }
    if (G.state === 'play' && G.P.grav !== this.dir && overlap(G.P, this)) { setGrav(this.dir); this.cd = 0.4; } }
  draw(c, W) { drawPad(c, this, W); }
}

class Lantern {               // punto de control
  constructor(x, y) { Object.assign(this, { x: x + 4, y: y - 44, w: 22, h: 44, lit: false, t: 0 }); }
  update(dt) { this.t += dt;
    if (!this.lit && G.state === 'play' && overlap(G.P, this)) { this.lit = true; G.cp = { x: this.x + 1, y: this.y + this.h - G.P.h, mirror: G.mirror, inverted: G.inverted }; SFX.lamp(); bubble(G.P, t('checkpoint'), 1.3); burst(this.x + 11, this.y + 8, 10, [G.W.glow, '#fff'], 120); } }
  draw(c, W) { drawLantern(c, this, W); }
}

class Chaser {                // lo que te persigue en los niveles de huida
  constructor(x, speed, style) { Object.assign(this, { x, speed, style, s: 'idle', t: 0 }); }
  go() { if (this.s === 'idle') { this.s = 'run'; SFX.horn(); shake(4, 0.4); bubble(G.P, pick(tl('chase')), 1.4); } }
  update(dt) {
    this.t += dt; if (this.s !== 'run' || G.state !== 'play') return;
    const P = G.P, gap = P.x - this.x, boost = gap > 420 ? 1.5 : 1;  // si te alejas mucho, acelera un poco
    this.x += this.speed * boost * dt;
    if (P.x < this.x - 4) die('chase');
  }
  draw(c, W) { drawChaser(c, this, W); }
}

class Decoy {                 // puerta falsa que muerde
  constructor(x, y) { Object.assign(this, { x, y, w: 28, h: 42, s: 'idle', bite: 0, t: 0 }); }
  update(dt) {
    this.t += dt;
    if (this.s === 'idle' && G.state === 'play' && overlap(G.P, { x: this.x - 14, y: this.y - 8, w: this.w + 28, h: this.h + 8 })) { this.s = 'bite'; SFX.trap(); bubble(this, t('bite'), 1.1); }
    if (this.s === 'bite') this.bite = Math.min(1, this.bite + dt / 0.08);
  }
  hazards(o) { if (this.bite > 0.5) o.push({ x: this.x + 3, y: this.y + 4, w: this.w - 6, h: this.h - 4, cause: 'bite' }); }
  draw(c, W) { drawDoor(c, this, W, this.bite, true); }
}

class Door {                  // la salida (a veces cobarde)
  constructor(x, y, ceil) { Object.assign(this, { x, y, w: 28, h: 42, ceil, flees: [], s: 'idle', k: 0, t: 0, from: null, to: null, invertOnFlee: false, didInvert: false }); }
  enterable() { return this.s === 'idle' && this.flees.length === 0; }
  update(dt) {
    this.t += dt;
    if (this.s === 'idle' && this.flees.length && G.state === 'play') {
      const P = G.P, dx = (P.x + P.w / 2) - (this.x + this.w / 2), dy = (P.y + P.h / 2) - (this.y + this.h / 2);
      const ch = G.L.chaser;
      if (ch && ch.s === 'run' && this.flees.some(f => f.x < ch.x + 160)) this.flees = [];   // red de seguridad: nunca huir hacia lo que persigue
      if (this.flees.length && Math.abs(dx) < 82 && Math.abs(dy) < 80) {
        this.to = this.flees.shift(); this.from = { x: this.x, y: this.y }; this.s = 'hop'; this.k = 0;
        SFX.hop(); bubble(this, pick(tl('door')), 1.3);
        if (this.invertOnFlee && !this.didInvert) { this.didInvert = true; toggleInvert(); }
      }
    }
    if (this.s === 'hop') {
      this.k = Math.min(1, this.k + dt / 0.9); const e = this.k;
      this.x = lerp(this.from.x, this.to.x, e); this.y = lerp(this.from.y, this.to.y, e) - Math.sin(e * Math.PI) * 170;
      if (e >= 1) { this.s = 'idle'; this.x = this.to.x; this.y = this.to.y; SFX.land(); dust(this.x + this.w / 2, this.y + this.h, 8, 1); }
    }
  }
  draw(c, W) { drawDoor(c, this, W, 0, false); }
}

// =========================================================
//  GENERADOR (1/2): piezas de nivel

// =========================================================
function platform(g, c, n, row, fake, crum, shakeT) {
  const x = g.X(c, n), y = g.Y(row);
  if (fake) g.L.fakes.push({ x, y, w: n * T, h: T, kind: 'p', revealed: false, a: 1 });

}
const invTile = (g, c, row) => g.L.solids.push({ x: g.X(c), y: g.Y(row), w: T, h: T, kind: 'p', inv: true, revealed: false, ra: 0 });
const fakeGround = (g, c, n) => g.L.fakes.push({ x: g.X(c, n), y: g.Y(g.F), w: n * T, h: g.gh(), kind: 'g', revealed: false, a: 1 });

}
const fwd = g => g.mirror ? -1 : 1;   // sentido de avance en el mundo

// w: mundo donde aparece (-1 = relleno). chase: se puede usar en una persecución (no obliga a esperar)
const SEG = {
  calm:   { w: -1, chase: true, plan(g) { const n = g.ri(3, 5); return { n, go() { g.ground(n); } }; } },

  step:   { w: -1, chase: true, plan(g) { const dF = (g.rng() < 0.5 ? -1 : 1) * g.ri(1, 2); return { n: 2, go() { g.F = clamp(g.F + dF, g.Fmin, g.Fmax); g.ground(2); } }; } },
  hop:    { w: -1, chase: true, plan(g) {

            return { n: 10, go() { g.ground(1); const c0 = g.c, row = g.F - 1, sh = 0.2 + g.v() * 0.2;
              platform(g, c0 + 1, 2, row, troll && which, crum, sh); platform(g, c0 + 4, 2, row, troll && !which, crum, sh); g.pit(7); g.ground(2); } }; } },
  // ---- Mundo 1: el suelo miente ----
  fakeFloor: { w: 0, chase: true, plan(g) { const fw = g.ri(2, 3);
            return { n: 7, go() { g.ground(1); const c0 = g.c, none = g.v() < 0.2, o = Math.floor(g.v() * (6 - fw));
              for (let k = 0; k < 5; k++) { const isFake = !none && k >= o && k < o + fw;
                if (isFake) { if (k === o) fakeGround(g, c0 + k, fw); g.pit(1); } else g.ground(1, false); }
              g.ground(1); } }; } },
  pop:    { w: 0, chase: true, plan(g) { const m = g.d > 0.5 ? 2 : 1;
            return { n: 7, go() { const c0 = g.c; g.ground(7, false);
              const mode = g.chase ? 'early' : pick(['early', 'late', 'fake', 'double'], g.v);
              const a = g.ent(new PopSpike(g.X(c0 + 2, m), g.Y(g.F), m * T, mode));
              g.trig(mode === 'late' ? c0 + 1.5 : c0 + 1, mode === 'late' ? 0.5 : 1, () => a.pop());
              if (mode === 'fake') { const b = g.ent(new PopSpike(g.X(c0 + 5), g.Y(g.F), T, 'early')); g.trig(c0 + 3.8, 0.6, () => b.pop()); } } }; } },
  fall:   { w: 0, plan(g) { const two = g.d > 0.5 && g.rng() < 0.5;
            return { n: two ? 8 : 5, go() { const c0 = g.c; g.ground(two ? 8 : 5, false);
              const a = g.ent(new FallSpike(g.X(c0 + 3), g.Y(g.ceil[c0 + 3]), pick(['drop', 'drop', 'under', 'stay'], g.v))); g.trig(c0, 1, () => a.drop());
              if (two) { const b = g.ent(new FallSpike(g.X(c0 + 6), g.Y(g.ceil[c0 + 6]), pick(['drop', 'under'], g.v))); g.trig(c0 + 3.5, 1, () => b.drop()); } } }; } },
  hidden: { w: 0, plan(g) { return { n: 6, go() { g.ground(1); const c0 = g.c, r = g.v();
              if (r > 0.15) g.L.solids.push({ x: g.X(c0 + (r > 0.6 ? 1 : 0), 2), y: g.Y(g.F - 4), w: 2 * T, h: T, kind: 'p', inv: true, revealed: false, ra: 0 });

  bridge: { w: 0, chase: true, plan(g) { const holeGeo = g.d > 0.45 && g.rng() < 0.6;

              g.L.fakes.push({ x: g.X(c0 + 2 + Math.floor(g.v() * 3)), y: g.Y(g.F - 3), w: T, h: T, kind: 'p', revealed: false, a: 1 });

  boulder: { w: 0, chase: true, plan(g) {
            return { n: 12, go() { const c0 = g.c; g.ground(8, false); g.pit(2); g.ground(2);

  wind:   { w: 0, chase: true, plan(g) {
            return { n: 10, go() { const c0 = g.c; g.ground(2, false); g.pit(3); g.ground(5);
              const mode = g.chase ? pick(['tail', 'none'], g.v) : pick(['head', 'tail', 'none', 'head'], g.v), d = fwd(g);
              const f = mode === 'head' ? -d * 105 : mode === 'tail' ? d * 95 : 0;
              const z = g.ent(new Wind(g.X(c0 - 1, 8), g.Y(0), 8 * T, g.gh() + g.F * T, f, 1.6)); g.trig(c0, 1, () => { if (f) z.go(); else SFX.wind(); }); } }; } },
  spring: { w: 0, maxTH: 18, plan(g) { return { n: 7, ok: g.F >= g.Fmin + 4, go() { g.ground(2, false); g.ent(new Spring(g.X(g.c - 1), g.Y(g.F), 1000)); g.F -= 4; g.ground(5); } }; } },
  // ---- Mundo 2: lo que pisas se rompe ----
  crumble: { w: 1, chase: true, plan(g) { const three = g.d > 0.55 && g.rng() < 0.5;
            return { n: 10, go() { g.ground(1); const c0 = g.c, y = g.Y(g.F), sh = 0.18 + g.v() * 0.24;
              if (three) [1, 3, 5].forEach(k => g.ent(new Crumble(g.X(c0 + k), y, T, sh)));
              else [1, 4].forEach(k => g.ent(new Crumble(g.X(c0 + k, 2), y, 2 * T, sh)));
              g.pit(7); g.ground(2); } }; } },
  drop:   { w: 1, chase: true, plan(g) { const n = g.ri(2, 3);
            return { n: n + 3, go() { g.ground(1); const c0 = g.c, mode = g.chase ? 'early' : pick(['early', 'now', 'rumble'], g.v);
              const e = g.ent(new DropFloor(g.X(c0, n), g.Y(g.F), n * T, g.gh(), mode === 'rumble' ? 'rumble' : 'now'));
              if (mode === 'early') g.trig(c0 - 1.6, 0.6, () => e.drop()); else if (mode === 'now') g.trig(c0 - 0.65, 0.65, () => e.drop()); else g.trig(c0 + 0.4, 0.5, () => e.drop());
              g.pit(n); g.ground(2); } }; } },
  slide:  { w: 1, chase: true, plan(g) {
            return { n: 9, go() { g.ground(1); const c0 = g.c, mode = g.chase ? pick(['early', 'none'], g.v) : pick(['early', 'onland', 'none', 'early'], g.v);

};

// =========================================================
//  GENERADOR (2/2): tipos de nivel, director de variedad y ensamblaje
// =========================================================
// Tipo de cada nivel del 2 al 20 (el 1 es de introducción). Se rota por mundo para que no coincidan.
const SCHED = ['room', 'run', 'room', 'descent', 'run', 'room', 'run', 'descent', 'chase', 'room', 'run', 'descent', 'run', 'room', 'run', 'descent', 'run', 'room', 'chase'];
function levelPlan(wi, li) {
  const r = mulberry32((wi + 3) * 1543 + li * 97);
  if (li === 0 || (wi === 0 && li === 1)) return { kind: 'room', cols: VC, tiers: 1, TH: VR };
  let kind = SCHED[li - 1];
  if (kind !== 'chase') { const alt = SCHED[(li - 1 + wi * 3) % SCHED.length]; if (alt !== 'chase') kind = alt; }

// ---------- Ciclo de vida de un nivel ----------
function startLevel(wi, li) {
  G.wi = wi; G.li = li; G.W = WORLDS[wi]; G.sessionDeaths = 0; G.cp = null; G.lastDeath = null; G.streak = 0; G.levelT = 0;
  SAVE.world = wi; persist(); resetLevel(true); setScreen('play'); updateSkip();
}
function resetLevel(first) {
  G.L = buildLevel(G.wi, G.li, SAVE.deaths[G.wi][G.li]); prepArt(G.L);
  const s = G.cp || G.L.start; G.P = newPlayer(s.x, s.y);
  G.inverted = false; G.mirror = false; G.flipA = 0; G.mirA = 0; G.state = 'play'; G.deathT = 0; G.winT = 0; G.winDone = false;
  G.bubbles = []; IN.jp = false; G.idleT = 0; G.frameSolids = collectSolids();
  if (G.cp) {   // al volver a un farol: los faroles anteriores ya están encendidos
    for (const e of G.L.ents) if (e instanceof Lantern && e.x <= G.cp.x + 30 && e.y <= G.cp.y + 60) e.lit = true;
    G.mirror = !!G.cp.mirror; G.mirA = G.mirror ? 1 : 0; G.inverted = !!G.cp.inverted;
    if (G.L.chaser) { G.L.chaser.x = G.cp.x - 330; G.L.triggers.push({ x: G.cp.x + 40, y: -200, w: T, h: G.L.h + 400, fn: () => G.L.chaser.go(), fired: false }); }
  }
  updateCam(0, true);
  if (first && G.L.hint && SAVE.deaths[G.wi][G.li] === 0) bubble(G.P, G.L.hint, 3.4);
  else if (first && G.L.dark) say('dark', 1.8);
  else if (first && R() < 0.5) say('start', 2);
  const el = document.getElementById('lvlLabel'); if (el) el.textContent = `${G.wi + 1}-${G.li + 1}`;
}
function die(cause) {
  if (G.state !== 'play') return;
  const P = G.P; G.state = 'dead'; G.deathT = 0.6;
  burst(P.x + P.w / 2, P.y + P.h / 2, 26, CHARS[curChar()].burst.concat([G.W.glow]), 300);
  addPart({ x: P.x + P.w / 2, y: P.grav > 0 ? P.y + P.h : P.y, vx: 0, vy: -70 * P.grav, life: 1.1, max: 1.1, sz: 1, c: '#fff', g: 0, rot: 0, vr: 0, k: 3, face: P.face, flip: P.grav < 0, ch: curChar() });
  shake(10, 0.35); G.flash = 0.55; SFX.die(); vibrate(60);
  SAVE.deaths[G.wi][G.li]++; G.sessionDeaths++; persist();
  const here = { x: P.x, y: P.y, cause };
  G.streak = (G.lastDeath && Math.abs(G.lastDeath.x - here.x) < 70 && Math.abs(G.lastDeath.y - here.y) < 90) ? G.streak + 1 : 0;
  G.lastDeath = here; updateSkip();
}
function respawn() {
  resetLevel(false);
  const n = SAVE.deaths[G.wi][G.li], c = G.lastDeath ? G.lastDeath.cause : 'fall';
  if (G.streak >= 2) say('streak');
  else if (n % 12 === 0 && n >= 24) say('many', 2.2);
  else if (G.sessionDeaths === 1 || R() < 0.5) say('q_' + c);
}
function win() {
  G.state = 'win'; G.winT = 0; G.winDone = false; SFX.door();
  const d = G.L.door; burst(d.x + d.w / 2, d.y + d.h / 2, 18, [G.W.glow, '#ffffff', '#ffd98a'], 200);
}
function completeLevel(skipped) {
  const wi = G.wi, li = G.li;
  SAVE.done[wi][li] = true; if (skipped) SAVE.skipped[wi][li] = true; if (li < 19) SAVE.sel[wi] = li + 1; SAVE.world = wi;
  SAVE.ads.since++; persist();
  if (!skipped) { G.mapLine = pick(charLines('win', curChar())); G.mapLineUntil = G.t + 3.6; }
  const cleared = SAVE.done[wi].every(Boolean) && !SAVE.cleared[wi];
  const go = () => transition(() => {
    if (cleared) { SAVE.cleared[wi] = true; persist(); storyAfterWorld(wi, () => { openMap(wi, li < 19 ? li + 1 : li); showWorldClear(wi); }); }
    else openMap(wi, li < 19 ? li + 1 : li); });
  maybeInterstitial(go);
}

function updatePlay(dt) {
  const L = G.L, P = G.P;
  G.levelT += dt;
  G.flipA = approach(G.flipA, (P.grav < 0 && SAVE.settings.flip) ? 1 : 0, dt / 0.35);
  G.mirA = approach(G.mirA, G.mirror ? 1 : 0, dt / 0.4);
  for (const b of G.bubbles) b.t += dt;
  G.bubbles = G.bubbles.filter(b => b.t < b.life);
  for (const f of L.fakes) if (f.revealed) f.a = Math.max(0.16, f.a - dt * 3);
  for (const s of L.solids) if (s.inv && s.revealed && s.ra < 1) s.ra = Math.min(1, s.ra + dt * 4);

  G.frameSolids = collectSolids(); G.windAx = 0;
  for (const e of L.ents) e.update(dt);
  L.door.update(dt);

  if (G.state === 'dead') { G.deathT -= dt; if (G.deathT <= 0) respawn(); return; }
  if (G.state === 'win') { G.winT += dt; if (G.winT >= 0.8 && !G.winDone) { G.winDone = true; completeLevel(false); } return; }

  for (const tr of L.triggers) if (!tr.fired && overlap(P, tr)) { tr.fired = true; tr.fn(); }
  if (G.state !== 'play') return;
  if (IN.jp) { P.buf = PH.buf; IN.jp = false; }
  G.frameSolids = collectSolids();
  const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n;
  for (let i = 0; i < n && G.state === 'play'; i++) stepPlayer(P, h, G.frameSolids);
  if (G.state !== 'play') return;

  for (const f of L.fakes) if (!f.revealed && overlap(P, f)) { f.revealed = true; SFX.crumble(); burst(P.x + P.w / 2, P.grav > 0 ? P.y + P.h : P.y, 10, G.W.tufts, 180); }
  const pb = pbox();
  for (const hb of L.spikeBoxes) if (overlap(pb, hb)) { die('thorn'); return; }
  const hz = []; for (const e of L.ents) if (e.hazards) e.hazards(hz);
  for (const hb of hz) if (hb.circ ? circRect(hb, pb) : overlap(pb, hb)) { die(hb.cause || 'thorn'); return; }
  if (P.y > L.h + 50) { die('fall'); return; }
  if (P.y < -90) { die('void'); return; }
  const d = L.door;
  if (d.enterable() && overlap(pb, { x: d.x + 4, y: d.y + 6, w: d.w - 8, h: d.h - 10 })) { win(); return; }

  updateCam(dt, false);
  // Animación y bufanda
  P.sq = approach(P.sq, 0, dt * 2.2);
  if (P.ground && Math.abs(P.vx) > 20) P.run += dt * Math.abs(P.vx) / 14; else P.run = 0;
  P.air = P.ground ? 0 : P.air + dt;
  P.blink -= dt; if (P.blink < -0.12) P.blink = 2 + R() * 3.5;
  P.leafT -= dt;
  if (P.ground && Math.abs(P.vx) > 170 && P.leafT <= 0) {
    P.leafT = 0.09;
    addPart({ x: P.x + P.w / 2 - P.face * 8, y: P.grav > 0 ? P.y + P.h - 2 : P.y + 2, vx: -P.face * (30 + R() * 50), vy: -P.grav * (40 + R() * 70),
      life: 0.5, max: 0.5, sz: 2 + R() * 2, c: pick(G.W.tufts), g: 500 * P.grav, rot: R() * 6, vr: (R() - 0.5) * 14, k: 1 });
  }
  const tr = CHARS[curChar()].trail;
  if (tr) {
    const anchor = { x: P.x + P.w / 2 - P.face * (tr.collar ? 5 : 2), y: P.grav > 0 ? P.y + tr.dy : P.y + P.h - tr.dy };
    if (P.scarf.length !== tr.n) { P.scarf = []; for (let i = 0; i < tr.n; i++) P.scarf.push({ x: anchor.x, y: anchor.y }); }
    P.scarf[0] = anchor;
    for (let i = 1; i < P.scarf.length; i++) {
      const a = P.scarf[i - 1], b = P.scarf[i];
      b.x += (-P.face * 12 - P.vx * 0.02) * dt + Math.sin(G.t * 9 + i) * 0.3; b.y += 20 * P.grav * dt;
      const dx = b.x - a.x, dy = b.y - a.y, dd = Math.hypot(dx, dy) || 1;
      b.x = a.x + dx / dd * tr.seg; b.y = a.y + dy / dd * tr.seg;
    }
  } else P.scarf = [];
  const wasIdle = P.idle; P.idle = (P.ground && Math.abs(P.vx) < 5 && G.state === 'play') ? P.idle + dt : 0;
  if (curChar() === 'hog' && wasIdle < 4 && P.idle >= 4) addPart({ x: P.x + P.w / 2 + P.face * 14, y: P.grav > 0 ? P.y + 8 : P.y + P.h - 8, vx: P.face * 30, vy: -20 * P.grav, life: 0.8, max: 0.8, sz: 4, c: 'rgba(255,255,255,0.5)', g: 0, rot: 0, vr: 0, k: 2 });
  // Frases si te quedas quieto demasiado
  G.idleT = (Math.abs(P.vx) < 5 && P.ground) ? G.idleT + dt : 0;
  if (G.idleT > 7) { G.idleT = -6; say('idle', 2); }
}

// Sonido de salto distinto para cada personaje
SFX.jump = () => { const c = curChar();
  if (c === 'frog') { tone('sine', 190, 120, 0.08, 0.1); tone('sine', 230, 150, 0.07, 0.08, 0.06); }
  else if (c === 'hog') tone('triangle', 150, 250, 0.1, 0.1);
  else tone('square', 420, 820, 0.09, 0.05); };

// =========================================================
//  RENDER: lienzo y fondos (siluetas planas con paralaje)
// =========================================================
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let VW = 1, VH = 1, DPR = 1, S = 1, OX = 0, OY = 0;
const BG = {};
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); VW = Math.max(1, innerWidth); VH = Math.max(1, innerHeight);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  S = Math.min(VW / LW, VH / LH); OX = (VW - LW * S) / 2; OY = (VH - LH * S) / 2;
  for (const k in BG) delete BG[k];
}
const screenT = () => cx.setTransform(DPR, 0, 0, DPR, 0, 0);
const BGK = 1.3, BGKY = 1.15;   // el fondo es algo mayor que la pantalla: permite paralaje al mover la cámara
function getBg(wi) {
  if (!BG[wi]) {
    for (const k in BG) if (+k !== 0) delete BG[k];
    const sc = Math.min(DPR, 1.5), w = VW * BGK, h = VH * BGKY, c = document.createElement('canvas');
    c.width = Math.round(w * sc); c.height = Math.round(h * sc);
    const x = c.getContext('2d'); x.scale(sc, sc); paintBg(x, wi, w, h, Math.max(S, 0.5)); BG[wi] = c;
  }
  return BG[wi];
}
function blitBg(wi, fx = 0.5, fy = 0.5) {
  const b = getBg(wi), dw = cv.width * BGK, dh = cv.height * BGKY;
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.drawImage(b, -(dw - cv.width) * fx, -(dh - cv.height) * fy, dw, dh);
}

function paintBg(x, wi, w, h, u) {
  const W = WORLDS[wi], r = mulberry32(4242 + wi * 97);
  const sky = x.createLinearGradient(0, 0, 0, h);
  W.sky.forEach((col, i) => sky.addColorStop(i / (W.sky.length - 1), col));
  x.fillStyle = sky; x.fillRect(0, 0, w, h);
  const gx = w * W.glowPos[0], gy = h * W.glowPos[1], gg = x.createRadialGradient(gx, gy, 0, gx, gy, Math.max(w, h) * 0.55);
  gg.addColorStop(0, hexA(W.glow, 0.42)); gg.addColorStop(1, hexA(W.glow, 0));
  x.fillStyle = gg; x.fillRect(0, 0, w, h);
  PAINT[W.bg](x, W, w, h, u, r);
  x.globalAlpha = 1;
}
function ridge(x, w, h, base, amp, step, r) {
  x.beginPath(); x.moveTo(-10, h + 10);
  for (let xx = -10; xx <= w + step; xx += step) x.lineTo(xx, base + (r() - 0.5) * amp * 2);
  x.lineTo(w + 10, h + 10); x.closePath(); x.fill();
}
function softGlow(x, px, py, rad, col, a) {
  const g = x.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, hexA(col, a)); g.addColorStop(1, hexA(col, 0));
  x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2);
}
const PAINT = {
  forest(x, W, w, h, u, r) {
    const layers = [[W.far, 0.5, 0.45, 10], [W.mid, 0.85, 0.7, 7], [W.near, 1, 1.1, 4]];
    for (const [col, al, dp, cnt] of layers) {
      x.fillStyle = col; x.globalAlpha = al;
      const n = Math.max(3, Math.round(cnt * w / (960 * u)));
      for (let i = 0; i < n; i++) {
        const bx = (i + 0.15 + r() * 0.7) * (w / n), tw = (12 + r() * 18) * u * dp, lean = (r() - 0.5) * 0.25 * h;
        x.beginPath(); x.moveTo(bx + lean - tw * 0.4, -5); x.lineTo(bx + lean + tw * 0.4, -5);
        x.lineTo(bx + tw * 0.6, h + 5); x.lineTo(bx - tw * 0.6, h + 5); x.closePath(); x.fill();
        const nb = 1 + Math.floor(r() * 3);
        for (let b = 0; b < nb; b++) {
          const by = h * (0.1 + r() * 0.45), dir = r() < 0.5 ? -1 : 1, bl = (50 + r() * 110) * u * dp, bxx = bx + lean * (1 - by / h), bw = Math.max(2, tw * 0.2);
          x.beginPath(); x.moveTo(bxx, by - bw); x.lineTo(bxx + dir * bl, by - bl * (0.45 + r() * 0.5));
          x.lineTo(bxx + dir * bl * 0.96, by - bl * 0.4 + bw); x.lineTo(bxx, by + bw * 2); x.closePath(); x.fill();
        }
      }
      ridge(x, w, h, h - 26 * u * dp, 12 * u, 36 * u, r);
    }
  },
  rail(x, W, w, h, u, r) {
    x.fillStyle = W.far; ridge(x, w, h, h * 0.64, 22 * u, 70 * u, r);
    const tx = w * (0.12 + r() * 0.2), ty = h * 0.4;
    x.fillStyle = W.mid; x.fillRect(tx - 34 * u, ty - 44 * u, 68 * u, 44 * u);
    x.beginPath(); x.moveTo(tx - 40 * u, ty - 44 * u); x.lineTo(tx, ty - 70 * u); x.lineTo(tx + 40 * u, ty - 44 * u); x.fill();
    for (const k of [-26, -8, 8, 26]) x.fillRect(tx + k * u - 2 * u, ty, 4 * u, h * 0.3);
    const n = Math.max(3, Math.round(5 * w / (960 * u))), pts = [];
    for (let i = 0; i < n; i++) {
      const px = (i + 0.5) * (w / n) + (r() - 0.5) * 30 * u, top = h * (0.26 + r() * 0.08);
      x.fillStyle = W.mid; x.fillRect(px - 3 * u, top, 6 * u, h); x.fillRect(px - 28 * u, top + 10 * u, 56 * u, 4 * u); pts.push([px, top + 10 * u]);
    }
    x.strokeStyle = W.mid; x.lineWidth = 1.5 * u;
    for (let k = 0; k < 3; k++) for (let i = 0; i < n - 1; i++) {
      const a = pts[i], b = pts[i + 1], off = (k - 1) * 22 * u;
      x.beginPath(); x.moveTo(a[0] + off, a[1]); x.quadraticCurveTo((a[0] + b[0]) / 2, a[1] + 42 * u, b[0] + off, b[1]); x.stroke();

    for (const [px, py] of pts) if (r() < 0.6) { softGlow(x, px + 24 * u, py + 8 * u, 70 * u, W.glow, 0.3); x.fillStyle = W.glow; x.fillRect(px + 20 * u, py + 4 * u, 9 * u, 5 * u); }
    x.fillStyle = W.near; ridge(x, w, h, h * 0.9, 8 * u, 16 * u, r);
  },
  town(x, W, w, h, u, r) {
    x.fillStyle = W.far; x.globalAlpha = 0.85;
    for (let xx = 0; xx < w + 40; xx += 36 * u) { x.beginPath(); x.arc(xx + r() * 20 * u, h * 0.6 + r() * 24 * u, (28 + r() * 30) * u, 0, 7); x.fill(); }
    x.fillRect(0, h * 0.62, w, h); x.globalAlpha = 1;
    let xx = -20 * u, steeple = false;
    while (xx < w) {
      const hw = (60 + r() * 80) * u, hh = (50 + r() * 90) * u, base = h * 0.82 + r() * 18 * u;
      x.fillStyle = W.mid; x.fillRect(xx, base - hh, hw, h);
      x.beginPath(); x.moveTo(xx - 6 * u, base - hh); x.lineTo(xx + hw / 2, base - hh - hw * 0.42); x.lineTo(xx + hw + 6 * u, base - hh); x.fill();
      x.fillRect(xx + hw * 0.7, base - hh - hw * 0.35, 9 * u, hw * 0.3);
      if (!steeple && xx > w * 0.4) { steeple = true; x.fillRect(xx + hw / 2 - 10 * u, base - hh - 130 * u, 20 * u, 130 * u);
        x.beginPath(); x.moveTo(xx + hw / 2 - 14 * u, base - hh - 130 * u); x.lineTo(xx + hw / 2, base - hh - 190 * u); x.lineTo(xx + hw / 2 + 14 * u, base - hh - 130 * u); x.fill(); }
      const cols = Math.max(1, Math.floor(hw / (26 * u))), rows = Math.max(1, Math.floor(hh / (34 * u)));
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        const wx = xx + 10 * u + i * (hw - 20 * u) / cols, wy = base - hh + 14 * u + j * 32 * u;
        if (r() < 0.45) { softGlow(x, wx + 6 * u, wy + 7 * u, 26 * u, W.glow, 0.3); x.fillStyle = W.glow; } else x.fillStyle = W.near;
        x.fillRect(wx, wy, 12 * u, 15 * u);
      }
      xx += hw + (12 + r() * 40) * u;
    }
    x.fillStyle = W.near; x.fillRect(0, h * 0.93, w, h);
    for (let fx = 0; fx < w; fx += 18 * u) x.fillRect(fx, h * 0.885, 6 * u, h * 0.1);
    x.fillRect(0, h * 0.9, w, 3 * u);
  },
  mine(x, W, w, h, u, r) {
    x.fillStyle = W.far;
    for (let i = 0; i < 26; i++) { const px = r() * w, py = r() * h, s = (40 + r() * 90) * u;
      x.globalAlpha = 0.35 + r() * 0.3; x.beginPath(); x.moveTo(px, py - s); x.lineTo(px + s * 0.8, py - s * 0.2); x.lineTo(px + s * 0.4, py + s * 0.7); x.lineTo(px - s * 0.7, py + s * 0.3); x.fill(); }
    x.globalAlpha = 1; x.fillStyle = W.mid;
    const n = Math.max(2, Math.round(4 * w / (960 * u)));
    for (let i = 0; i < n; i++) { const px = (i + 0.3 + r() * 0.4) * (w / n), bw = (90 + r() * 70) * u, top = h * (0.18 + r() * 0.1);
      x.fillRect(px, top, 12 * u, h); x.fillRect(px + bw, top, 12 * u, h); x.fillRect(px - 10 * u, top - 12 * u, bw + 32 * u, 16 * u);
      x.save(); x.translate(px + 12 * u, top + 4 * u); x.rotate(0.6); x.fillRect(0, 0, 40 * u, 6 * u); x.restore(); }
    for (let i = 0; i < 12; i++) { const px = r() * w, py = h * (0.72 + r() * 0.22), s = (8 + r() * 14) * u;
      softGlow(x, px, py, s * 5, W.glow, 0.35); x.fillStyle = r() < 0.5 ? W.glow : W.tufts[2];
      x.beginPath(); x.moveTo(px, py - s * 1.8); x.lineTo(px + s * 0.6, py); x.lineTo(px - s * 0.6, py); x.fill(); }
    x.fillStyle = W.near;
    x.beginPath(); x.moveTo(-10, -10);
    for (let xx = -10; xx <= w + 30; xx += 24 * u) { x.lineTo(xx, -5); x.lineTo(xx + 12 * u, (12 + r() * 40) * u * (r() < 0.2 ? 2.4 : 1)); }
    x.lineTo(w + 30, -10); x.closePath(); x.fill();
    ridge(x, w, h, h * 0.92, 10 * u, 22 * u, r);
  },
  hill(x, W, w, h, u, r) {
    const ns = Math.min(420, Math.round(260 * w * h / (960 * 540)));
    for (let i = 0; i < ns; i++) { x.fillStyle = `rgba(255,255,255,${0.15 + r() * 0.75})`; const s = r() < 0.1 ? 2.4 : 1.3; x.fillRect(r() * w, r() * h * 0.8, s, s); }
    for (let b = 0; b < 3; b++) {
      const y0 = h * (0.18 + b * 0.08), gr = x.createLinearGradient(0, y0 - 40 * u, 0, y0 + 60 * u);
      gr.addColorStop(0, hexA(b === 1 ? '#7fd3ff' : W.glow, 0)); gr.addColorStop(0.5, hexA(b === 1 ? '#7fd3ff' : W.glow, 0.13)); gr.addColorStop(1, hexA(W.glow, 0));
      x.fillStyle = gr; x.beginPath(); x.moveTo(0, y0);
      for (let xx = 0; xx <= w; xx += 20) x.lineTo(xx, y0 + Math.sin(xx * 0.004 / u + b * 2) * 34 * u);
      for (let xx = w; xx >= 0; xx -= 20) x.lineTo(xx, y0 + 70 * u + Math.sin(xx * 0.005 / u + b) * 30 * u);

      x.lineTo(w, h); x.closePath(); x.fill();

  ST.full = panelText(p); ST.shown = 0; ST.pt = 0; $('storyText').textContent = ''; $('storyHint').textContent = '';
  if (p[0] === 'f') noise(1.4, 0.07, 260, 'bandpass'); else if (p[0] === 'note') noise(0.25, 0.05, 3000, 'highpass');
}
const storyHint = () => { $('storyHint').textContent = G.isTouch ? t('next_tap') : t('next_key'); };
function updateStory(dt) {
  ST.t += dt; ST.pt += dt;
  if (ST.shown < ST.full.length) {
    ST.shown = Math.min(ST.full.length, ST.shown + dt * 48); $('storyText').textContent = ST.full.slice(0, Math.floor(ST.shown));
    if (ST.shown >= ST.full.length) storyHint();
  }
}
function advanceStory() {
  if (G.screen !== 'story' || G.trans || !ST.id) return;
  if (ST.shown < ST.full.length) { ST.shown = ST.full.length; $('storyText').textContent = ST.full; storyHint(); return; }
  SFX.click(); ST.i++;
  if (ST.i >= storyP(ST.id).length) endStory(); else showPanel();
}
function endStory() { if (!ST.id) return; const d = ST.done; ST.done = null; transition(() => { ST.id = null; if (d) d(); else openMap(G.mapW); }); }
function enterWorld(w, sel) {   // al llegar por primera vez a un mundo se cuenta su capítulo
  const key = 'w' + (w + 1) + '_intro';
  if (w > 0 && worldUnlocked(w) && STORY_WORLD[key] !== undefined && !SAVE.story[key]) transition(() => playStory(key, () => openMap(w, sel)));
  else openMap(w, sel);
}
function storyAfterWorld(wi, then) { playStory(wi === 4 ? 'ending' : 'w' + (wi + 1) + '_end', then); }

// ---------- Escena ----------
function drawLeafBig(c, x, y, k, rot) {
  glowAt(c, x, y, 30 * k, '#ffb347', 0.5); c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = '#e8742a'; c.beginPath(); c.moveTo(0, -9 * k); c.quadraticCurveTo(8 * k, -3 * k, 0, 9 * k); c.quadraticCurveTo(-8 * k, -3 * k, 0, -9 * k); c.fill();
  c.fillStyle = '#f2b134'; c.beginPath(); c.moveTo(0, -9 * k); c.quadraticCurveTo(-8 * k, -3 * k, 0, 9 * k); c.lineTo(0, -9 * k); c.fill();
  c.strokeStyle = '#9c3b24'; c.lineWidth = 1.2 * k; c.beginPath(); c.moveTo(0, -8 * k); c.lineTo(0, 12 * k); c.stroke(); c.restore();
}
function drawOak(c, x, gy, k, W) {   // el Viejo Roble: silueta enorme con una sola hoja
  const col = shade(W.near, -0.25), h = 360 * k, tw = 70 * k; c.fillStyle = col; c.strokeStyle = col; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x - tw * 0.9, gy + 12); c.quadraticCurveTo(x - tw * 0.4, gy - h * 0.3, x - tw * 0.2, gy - h); c.lineTo(x + tw * 0.2, gy - h);
  c.quadraticCurveTo(x + tw * 0.45, gy - h * 0.3, x + tw, gy + 12); c.fill();
  for (const [dx, len] of [[-1, 90], [1, 70], [-0.5, 50]]) { c.lineWidth = 9 * k; c.beginPath(); c.moveTo(x + dx * tw * 0.3, gy); c.quadraticCurveTo(x + dx * len * 0.6 * k, gy + 4, x + dx * len * k, gy + 10); c.stroke(); }
  let tip = null;
  for (const [ox, hy, dx, dy] of [[-0.6, 0.6, -170, -110], [0.5, 0.52, 180, -90], [-0.25, 0.82, -120, -160], [0.3, 0.88, 130, -150], [0, 0.99, 40, -130]]) {
    const bx = x + ox * tw * 0.35, by = gy - h * hy, ex = bx + dx * k, ey = by + dy * k;
    c.lineWidth = 13 * k; c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(bx + dx * k * 0.35, by + dy * k * 0.75, ex, ey); c.stroke();
    c.lineWidth = 5 * k; c.beginPath(); c.moveTo(bx + dx * k * 0.6, by + dy * k * 0.7); c.lineTo(ex + dx * k * 0.28, ey - 34 * k); c.stroke();
    c.lineWidth = 3 * k; c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex + dx * k * 0.2, ey + 22 * k); c.stroke();
    const tx = ex + dx * k * 0.28, ty = ey - 34 * k; if (!tip || ty < tip.y) tip = { x: tx, y: ty };
  }
  return tip;
}
function forestEyes(c, x, y, u) {   // el bosque mira entre los árboles
  const b = (G.t % 3.4) < 0.14 ? 0.12 : 1; glowAt(c, x, y, 70 * u, '#ffb347', 0.18);
  c.fillStyle = '#ffd98a'; for (const s of [-1, 1]) { c.beginPath(); c.ellipse(x + s * 15 * u, y, 5.5 * u, 4.2 * u * b, s * 0.15, 0, 7); c.fill(); }
}
function renderStory() {
  if (!ST.id) return;
  const wi = STORY_WORLD[ST.id] || 0, W = WORLDS[wi], u = Math.max(S, 0.6), p = storyP(ST.id)[ST.i] || ['n', ''];
  blitBg(wi); drawAmb(); screenT();
  const gy = VH * (VH < 520 ? 0.58 : 0.68);
  let tip = null;
  const oak = ST.id === 'prologue' || ST.id === 'w5_intro' || ST.id === 'ending', ok = ST.id === 'prologue' ? 0.5 : 0.95;
  if (oak) tip = drawOak(cx, VW * (ST.id === 'prologue' ? 0.8 : 0.72), gy + (ST.id === 'prologue' ? -40 * u : 4 * u), u * ok, W);
  cx.fillStyle = W.ground; cx.beginPath(); cx.moveTo(-10, VH + 10); cx.lineTo(-10, gy + 6 * u);
  for (let x = 0; x <= VW + 60; x += 60) cx.lineTo(x, gy + Math.sin(x * 0.011 + wi) * 6 * u);
  cx.lineTo(VW + 10, VH + 10); cx.closePath(); cx.fill();
  if (p[0] === 'f') forestEyes(cx, VW * 0.55, gy - 190 * u, u);
  const hx = VW * 0.28, hy = gy + 3 * u, s = 2.6 * u, ch = curChar();
  const mood = p[0] === 'f' && ST.id === 'w1_end' && ST.i === 0 ? 'scared' : (ST.id === 'ending' && ST.i >= 2) ? 'happy' : 'idle';
  if (ch === 'mouse') { const sw = Math.sin(G.t * 2) * 2 * u; cx.strokeStyle = '#e9b23a'; cx.lineWidth = 4 * s; cx.lineCap = 'round'; cx.beginPath();
    cx.moveTo(hx - 4 * s, hy - 11 * s); cx.quadraticCurveTo(hx - 12 * s, hy - 10 * s + sw, hx - 16 * s, hy - 5 * s + sw); cx.stroke(); }
  drawChar(cx, ch, hx, hy, { face: 1, s, mood, idle: 2.5 + (ST.t % 7), blinking: (G.t % 4) < 0.12 });
  if (tip) {
    if (ST.id === 'ending') { const k = ST.i === 0 ? clamp(ST.pt / 2.8, 0, 1) : 1, e = k * k * (3 - 2 * k);
      drawLeafBig(cx, lerp(tip.x, hx + 10 * s, e) + Math.sin(k * 11) * 40 * u * (1 - k), lerp(tip.y, hy - 14 * s, e), u * 1.7, (1 - k) * G.t * 3); }
    else drawLeafBig(cx, tip.x, tip.y, u * 1.4 * ok, Math.sin(G.t * 4) * 0.35);
  }
  const vg = cx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.4, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)'); cx.fillStyle = vg; cx.fillRect(0, 0, VW, VH);
}

// ---------- Diario ----------
function openJournal() {
  const T2 = (STORY[LANG] || STORY.es).titles;
  const rows = STORY_ORDER.map((id, n) => { const seen = !!SAVE.story[id];
    return `<div class="row"><span>${n + 1}. ${seen ? T2[id] : t('locked_ch')}</span>${seen ? `<button data-a="readCh" data-c="${id}">${t('read')}</button>` : ''}</div>`; }).join('');
  openModal(`<h2>${t('journal')}</h2><p class="small">${t('j_sub')}</p><div>${rows}</div>
  <div class="col" style="margin-top:14px"><button class="primary" data-a="close">${t('done')}</button></div>`, 'journal');
}

// =========================================================
//  ACCIONES, ENTRADA (teclado, táctil, mando) Y BUCLE
// =========================================================
const ACT = {
  resume() { resume(); updateSkip(); }, close: closeModal,
  restart() { G.paused = false; closeModal(); if (G.state === 'play') die('quit'); },
  settingsP() { openSettings('pause'); },
  toMap() { G.paused = false; closeModal(); transition(() => openMap(G.wi, G.li)); },
  back() { if (G.modalFrom === 'pause') showPause(); else closeModal(); },
  fs: toggleFS, privacy() { showConsent('settings'); },
  wipe() { openModal(`<h2>${t('wipe_q')}</h2><p>${t('wipe_txt')}</p><div class="col"><button data-a="wipeYes">${t('wipe')}</button><button class="primary" data-a="wipeNo">${t('cancel')}</button></div>`, 'wipe'); },
  wipeYes() { const st = SAVE.settings, cs = SAVE.consent; SAVE = defSave(); SAVE.settings = st; SAVE.consent = cs; persist(); G.paused = false; closeModal(); transition(() => setScreen('title')); },
  wipeNo() { openSettings(); },
  nextWorld() { closeModal(); enterWorld(G.clearW + 1, 0); },
  readCh(b) { const id = b.dataset.c; closeModal(); transition(() => playStory(id, () => openMap(G.mapW))); },
  cAccept() { setConsent(true); }, cReject() { setConsent(false); }, cMore() { showConsentMore(); },
  cSave() { const c = $('cPers'); setConsent(!!(c && c.checked)); },
  charsS() { openChars('settings'); },
  pick(b) { SAVE.settings.char = b.dataset.c; persist(); SFX.jump(); openChars(G.charFrom); },
  charsDone() { if (G.charFrom === 'settings') openSettings(); else closeModal(); }
};
panel.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; SFX.click(); const f = ACT[b.dataset.a]; if (f) f(b); });
function modalEscape() {
  const k = G.modalKind;
  if (k === 'consent' || k === 'ad') return;
  if (k === 'char') ACT.charsDone(); else if (k === 'pause' || k === 'skip') ACT.resume(); else if (k === 'settings') ACT.back(); else if (k === 'wipe') ACT.wipeNo();
  else if (k === 'clear') { if (G.clearW < 4) ACT.nextWorld(); else closeModal(); } else closeModal();
}
modal.addEventListener('pointerdown', e => { if (e.target === modal) modalEscape(); });

$('bPlay').addEventListener('click', () => { SFX.click(); goMap(); });
$('bSet1').addEventListener('click', () => { audioInit(); SFX.click(); openSettings(null); });
$('bChar').addEventListener('click', () => { audioInit(); SFX.click(); openChars(null); });
$('bSet2').addEventListener('click', () => { SFX.click(); openSettings(null); });
$('bMenu').addEventListener('click', () => { SFX.click(); goTitle(); });
$('bJournal').addEventListener('click', () => { SFX.click(); openJournal(); });
$('storyBox').addEventListener('click', () => advanceStory());
$('storySkip').addEventListener('click', () => { SFX.click(); endStory(); });
$('prevW').addEventListener('click', () => switchWorld(-1));
$('nextW').addEventListener('click', () => switchWorld(1));
$('pauseBtn').addEventListener('click', () => { audioInit(); pause(); });
$('skipBtn').addEventListener('click', () => { audioInit(); SFX.click(); offerSkip(); });
$('rotOk').addEventListener('click', () => { G.rotateOk = true; updateRotateTip(); });

// ---------- Controles táctiles ----------
const touchEl = $('touch'), TP = new Map();
function updateTouchVis() {
  const s = SAVE.settings, show = G.screen === 'play' && (s.touch === 'on' || (s.touch === 'auto' && G.isTouch));
  touchEl.classList.toggle('on', show); touchEl.style.setProperty('--bs', s.btn);
  const Lb = $('tL'), Rb = $('tR'), J = $('tJ'), off = Math.round(18 + 80 * s.btn + 14);
  const put = (el, side, px) => { el.style.left = side === 'l' ? `calc(var(--sl) + ${px}px)` : 'auto'; el.style.right = side === 'r' ? `calc(var(--sr) + ${px}px)` : 'auto'; el.style.bottom = 'calc(var(--sb) + 18px)'; };
  if (!s.lefty) { put(Lb, 'l', 18); put(Rb, 'l', off); put(J, 'r', 22); } else { put(J, 'l', 22); put(Lb, 'r', off); put(Rb, 'r', 18); }
  $('keysHint').style.display = G.isTouch ? 'none' : '';
}
function tKeyAt(x, y) {
  for (const [id, k] of [['tL', 'l'], ['tR', 'r'], ['tJ', 'j']]) { const r = $(id).getBoundingClientRect(), p = 14;
    if (x >= r.left - p && x <= r.right + p && y >= r.top - p && y <= r.bottom + p) return k; }
  return null;
}
function refreshTouch() {
  const pj = TOUCH.j; TOUCH.l = TOUCH.r = TOUCH.j = false;
  for (const k of TP.values()) if (k) TOUCH[k] = true;
  if (TOUCH.j && !pj) IN.jp = true;
  $('tL').classList.toggle('on', TOUCH.l); $('tR').classList.toggle('on', TOUCH.r); $('tJ').classList.toggle('on', TOUCH.j);
}
touchEl.addEventListener('pointerdown', e => { const k = tKeyAt(e.clientX, e.clientY); if (!k) return; e.preventDefault(); audioInit(); G.isTouch = true;
  TP.set(e.pointerId, k); try { e.target.setPointerCapture(e.pointerId); } catch (_) {} refreshTouch(); });
touchEl.addEventListener('pointermove', e => { if (!TP.has(e.pointerId)) return; const cur = TP.get(e.pointerId), k = tKeyAt(e.clientX, e.clientY);
  if (cur !== 'j' && k !== 'j') { TP.set(e.pointerId, k); refreshTouch(); } });
const tEnd = e => { if (TP.delete(e.pointerId)) refreshTouch(); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => touchEl.addEventListener(ev, tEnd));
addEventListener('touchstart', () => { if (!G.isTouch) { G.isTouch = true; updateTouchVis(); updateRotateTip(); } }, { passive: true });
addEventListener('contextmenu', e => e.preventDefault());

// ---------- Ratón / toque sobre el mapa ----------
function toMapLogical(e) { const m = mapXform(); return { x: (e.clientX - m.ox) / m.s, y: (e.clientY - m.oy) / m.s }; }
cv.addEventListener('pointerdown', e => {
  audioInit(); if (G.screen === 'story') { advanceStory(); return; }
  if (G.screen !== 'map' || modalOpen() || !worldUnlocked(G.mapW)) return;
  const { x, y } = toMapLogical(e), i = nodeAt(x, y); if (i < 0) return;
  if (e.pointerType === 'mouse' || i === G.mapSel) { G.mapSel = i; playSelected(); } else { G.mapSel = i; SFX.click(); }
});
cv.addEventListener('pointermove', e => {
  if (G.screen !== 'map' || e.pointerType !== 'mouse') return;
  const { x, y } = toMapLogical(e); G.mapHover = worldUnlocked(G.mapW) ? nodeAt(x, y) : -1; cv.style.cursor = G.mapHover >= 0 ? 'pointer' : 'default';
});

// ---------- Teclado ----------
const KMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'j', KeyW: 'j', Space: 'j', KeyZ: 'j', KeyK: 'j' };
addEventListener('keydown', e => {
  audioInit();
  const ae = document.activeElement, onCtl = ae && /^(BUTTON|INPUT|SELECT|A)$/.test(ae.tagName);
  if (modalOpen()) { if (e.code === 'Escape') { e.preventDefault(); modalEscape(); } return; }
  if (!onCtl && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (G.screen === 'play') {
    const k = KMAP[e.code];
    if (k) { if (k === 'j' && !KEY.j && !e.repeat) IN.jp = true; KEY[k] = true; e.preventDefault(); }
    if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) togglePause();
    if (e.code === 'KeyR' && !e.repeat && G.state === 'play') die('quit');
  } else if (G.screen === 'map') {
    if (onCtl && (e.code === 'Space' || e.code === 'Enter')) return;
    if (e.repeat && (e.code === 'Space' || e.code === 'Enter')) return;
    if (!worldUnlocked(G.mapW) && ['Space', 'Enter'].includes(e.code)) { SFX.bonk(); return; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') mapDir(-1, 0);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') mapDir(1, 0);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') mapDir(0, -1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') mapDir(0, 1);
    else if (e.code === 'Space' || e.code === 'Enter') playSelected();
    else if (e.code === 'KeyQ' || e.code === 'PageUp') switchWorld(-1);
    else if (e.code === 'KeyE' || e.code === 'PageDown') switchWorld(1);
    else if (e.code === 'Escape') goTitle();
  } else if (G.screen === 'title') {
    if (!onCtl && (e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); goMap(); }
  } else if (G.screen === 'story') {
    if (e.repeat) return;
    if (['Space', 'Enter', 'ArrowRight', 'KeyD', 'KeyW', 'ArrowUp', 'KeyZ'].includes(e.code)) { e.preventDefault(); advanceStory(); }
    else if (e.code === 'Escape') endStory();
  }
});
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) KEY[k] = false; });
addEventListener('blur', () => { KEY.l = KEY.r = KEY.j = false; TP.clear(); refreshTouch(); if (G.screen === 'play' && !modalOpen()) pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.screen === 'play' && !modalOpen()) pause(); });

// ---------- Mando ----------
function pollPad() {
  let gp = null;
  try { const ps = navigator.getGamepads ? navigator.getGamepads() : []; for (const p of ps) if (p && p.connected) { gp = p; break; } } catch (e) {}
  if (!gp) { PAD.l = PAD.r = PAD.j = false; return; }
  const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const n = { l: ax < -0.45 || b(14), r: ax > 0.45 || b(15), u: ay < -0.6 || b(12), d: ay > 0.6 || b(13), j: b(0) || b(1), st: b(9), lb: b(4), rb: b(5) };
  const edge = k => n[k] && !PAD[k];
  if (modalOpen()) { if (edge('st') && G.modalKind === 'pause') resume(); }
  else if (G.screen === 'play') { if (edge('j')) IN.jp = true; if (edge('st')) togglePause(); }
  else if (G.screen === 'map') {
    if (edge('l')) mapDir(-1, 0); if (edge('r')) mapDir(1, 0); if (edge('u')) mapDir(0, -1); if (edge('d')) mapDir(0, 1);
    if (edge('j')) playSelected(); if (edge('lb')) switchWorld(-1); if (edge('rb')) switchWorld(1);
  } else if (G.screen === 'title' && (edge('j') || edge('st'))) goMap();
  else if (G.screen === 'story') { if (edge('j') || edge('r')) advanceStory(); if (edge('st')) endStory(); }
  Object.assign(PAD, n);
}

// ---------- Bucle principal ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; G.t += dt;
  pollPad();
  if (G.shakeT > 0) G.shakeT -= dt; else G.shakeA = 0;
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.2);
  if (G.trans) { G.trans.t += dt / 0.22; if (!G.trans.done && G.trans.t >= 1) { G.trans.done = true; G.trans.fn(); } if (G.trans.t >= 2) G.trans = null; }
  const wi = G.screen === 'play' ? G.wi : G.screen === 'map' ? G.mapW : G.screen === 'story' ? (STORY_WORLD[ST.id] || 0) : 0;
  updateAmb(dt, wi);
  if (G.screen === 'play') { if (!G.paused) { updatePlay(dt); updateParts(dt); } renderPlay(); }
  else if (G.screen === 'map') { updateMap(dt); renderMap(); }
  else if (G.screen === 'story') { updateStory(dt); renderStory(); }
  else { updateTitle(dt); renderTitle(); }
  if (G.trans) { const a = G.trans.t < 1 ? G.trans.t : 2 - G.trans.t; screenT(); cx.fillStyle = `rgba(8,4,6,${clamp(a, 0, 1)})`; cx.fillRect(0, 0, VW, VH); }
  if (G.modalKind === 'char') drawCharPreviews();
  musicTick(wi);
  requestAnimationFrame(frame);
}

// ---------- Arranque ----------
loadSave(); applyLang();
G.isTouch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
resize();
addEventListener('resize', () => { resize(); G.amb = []; updateRotateTip(); });
setScreen('title');
if (needConsent()) showConsent(); else loadAds();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in BG) delete BG[k]; });
requestAnimationFrame(frame);
</script>
